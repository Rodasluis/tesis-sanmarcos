# ARCHIVO GENERADO. No lo edites: se sobrescribe al activar un perfil.
# Perfil activo : unmsm-general ((todas))
# Estado        : verificado
# Norma         : RR N.° 00744-R-20
# Herencia      : unmsm-general
# Regenerar con : uv run python -m herramientas.activar_perfil unmsm-general

project:
  type: default
  output-dir: entregables/_render
  # El código de los capítulos se ejecuta desde la raíz del proyecto y
  # no desde `capitulos/`. Así `resultados/tabla.csv` significa lo mismo
  # en un capítulo que en los scripts de `codigo/`, y una cifra
  # insertada no depende de en qué carpeta esté el .qmd que la inserta.
  execute-dir: project
  # Solo los capítulos. Sin esta lista, Quarto encuentra todos los .md
  # del proyecto y convierte a .docx las decisiones registradas, las
  # notas de normativa y los README de las plantillas.
  render:
    - capitulos/*.qmd

bibliography: referencias.bib
lang: es

format:
  docx:
    reference-doc: plantillas/unmsm-general/referencia.docx
    number-sections: false
    toc: false
    fig-align: center
    tbl-cap-location: top

# La numeración romana de los preliminares y el reinicio en arábigos NO se
# configuran aquí: Quarto no genera saltos de sección. Los aplica
# herramientas/docx_numeracion.py sobre el .docx ya renderizado.

execute:
  echo: false
  warning: false
  freeze: auto

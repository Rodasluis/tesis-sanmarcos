# Facultad de Ingeniería Industrial
# Perfil por herencia: sin documento propio de facultad localizado.
# Este perfil NO tiene documento propio de facultad. Hereda la estructura
# del perfil base `unmsm-general`, que sí es normativa: los Anexos 2A y 2B de la
# RR N.° 00744-R-20. Lo observado en Cybertesis se adjunta solo como contraste y
# nunca habilita `estado: verificado`.


name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo cancela la corrida anterior de la misma rama: lo que importa es
# el último estado, no la cola.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-y-pruebas:
    name: ruff y pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependencias
        run: uv sync --extra dev --extra analisis

      - name: ruff
        run: uv run ruff check .

      - name: pytest
        run: uv run python -m pytest -q

  ejemplos:
    name: verificar y renderizar los ejemplos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar LibreOffice
        # Convierte los .docx a PDF. El PDF es lo que exige la directiva de
        # depósito en Cybertesis (RR N.° 06893-R-18); el .docx, el art. 13.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Sincronizar dependencias
        run: uv sync --extra dev --extra analisis

      - name: Montar los ejemplos
        run: uv run python -m herramientas.preparar_ejemplo --todos

      - name: Verificar los ejemplos
        # Sin red a propósito: los datos de los ejemplos están versionados, así
        # que esta comprobación no puede fallar porque una API se caiga. La
        # comprobación de citas contra Crossref es otra cosa y va aparte.
        run: |
          for ejemplo in economia-cuantitativo medicina-cualitativo; do
            echo "::group::$ejemplo"
            uv run python -m herramientas.verificar_todo \
              --raiz ".ejemplos-montados/$ejemplo" --detalle
            echo "::endgroup::"
          done

      - name: Renderizar los ejemplos a .docx
        env:
          # Quarto ejecuta los bloques de código con el Python que encuentre, y
          # el del sistema no tiene las dependencias del proyecto.
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          for ejemplo in economia-cuantitativo medicina-cualitativo; do
            echo "::group::render $ejemplo"
            quarto render ".ejemplos-montados/$ejemplo"
            echo "::endgroup::"
          done

      - name: Comprobar que los .docx existen y no están vacíos
        run: uv run python -m herramientas.preparar_ejemplo --comprobar-render

      - name: Generar los entregables de los dos ejemplos
        # Es la prueba de punta a punta que importa: proyecto de tesis y tesis,
        # cada uno en .docx y PDF, con la carátula y el escudo de la UNMSM.
        #
        # Van LOS DOS, y los dos completos. Antes solo corría el cuantitativo,
        # y por eso nadie vio que al cualitativo le faltaba
        # `datos_de_entrega.yaml`: verificaba y renderizaba, pero `/entregar`
        # se detenía y jamás producía sus .docx. Después se saltaba su
        # proyecto, porque no estaba redactado. Ya lo está.
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          for ejemplo in economia-cuantitativo medicina-cualitativo; do
            echo "::group::entregables $ejemplo"
            raiz=".ejemplos-montados/$ejemplo"
            uv run python -m herramientas.entregar_proyecto --raiz "$raiz" --detalle
            uv run python -m herramientas.entregar --raiz "$raiz" --detalle
            echo "::endgroup::"
          done

      - name: Comprobar la carátula, el escudo y el reparto del art. 13
        # Comprueba que estén los cuatro entregables, que la carátula lleve el
        # escudo y que sea el archivo de «Protocolo y Complemento» quien la
        # lleve: el art. 13 A.2 a) describe el de Desarrollo como el documento
        # «sin carátula […] ni referencias bibliográficas».
        run: |
          for ejemplo in economia-cuantitativo medicina-cualitativo; do
            uv run python -m herramientas.preparar_ejemplo \
              --comprobar-entregables "$ejemplo"
          done

      - name: Guardar los entregables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejemplos-entregables
          path: |
            .ejemplos-montados/*/entregables/_render/**/*.docx
            .ejemplos-montados/*/entregables/PROYECTO/*
            .ejemplos-montados/*/entregables/TEXTO/*
          if-no-files-found: error

  perfiles:
    name: los 21 perfiles validan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - name: verificar_perfil
        run: uv run python -m herramientas.verificar_perfil

      - name: Ningún dato personal en los ejemplos
        # Los ejemplos son lo único del repositorio que versiona datos. Si
        # alguien agrega ahí una transcripción real, esto lo detiene.
        run: |
          uv run python -m herramientas.datos_personales ejemplos/*/datos/crudos/* ejemplos/*/datos/procesados/*

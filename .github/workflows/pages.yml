name: Publicar el sitio

# Manual a propósito. Si se disparara en cada push, fallaría —en rojo, en la
# portada del repositorio— mientras Pages no esté habilitado, y habilitarlo es
# un clic que solo puede dar el dueño: Settings → Pages → Source: GitHub
# Actions. Una vez habilitado, se puede cambiar a `push` sin más.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; no se cancela la que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que el sitio trae lo suyo
        # Sin esto, un sitio al que le falte el video se publica igual y nadie
        # se entera hasta que alguien abre la página.
        run: |
          for archivo in sitio/index.html sitio/tesis-sanmarcos.mp4 sitio/portada.jpg; do
            test -s "$archivo" || { echo "falta $archivo"; exit 1; }
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: deploy
        uses: actions/deploy-pages@v4

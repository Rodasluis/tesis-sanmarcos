    notas: >-
      Benchmarking de las empresas prestadoras de servicios de saneamiento:
      cobertura, continuidad, presión, agua no facturada, tarifas, indicadores
      de gestión. Serie larga y comparable entre EPS.

      Para tesis sobre acceso al agua, gestión de servicios públicos o
      eficiencia de empresas públicas.

  - id: senamhi
    nombre: SENAMHI — datos hidrometeorológicos
    url: https://www.senamhi.gob.pe/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: diaria
    desagregacion: [estación, cuenca, distrito]

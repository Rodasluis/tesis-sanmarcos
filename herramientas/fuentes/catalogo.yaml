  - id: encuestadoras_peru
    nombre: Encuestadoras de opinión pública
    url: https://www.ipsos.com/es-pe
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: mensual
    desagregacion: [nacional, Lima, urbano-rural]
    facultades: [Derecho y Ciencia Política, Ciencias Sociales, Ciencias Administrativas,

  - id: minsa
    nombre: MINSA — datos de salud
    url: https://www.minsa.gob.pe/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: variable
    desagregacion: [región, establecimiento]
    facultades: [Medicina, Farmacia y Bioquímica, Odontología, Psicología,

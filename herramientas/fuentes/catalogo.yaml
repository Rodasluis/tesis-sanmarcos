    tipo_acceso: manual
    frecuencia: continua
    desagregacion: [revista, artículo, año]
    facultades: [todas]
    portales:
      - {nombre: "SciELO Perú", url: "https://www.scielo.org.pe/"}
      - {nombre: "Redalyc", url: "https://www.redalyc.org/"}
    notas: >-
      Revistas peruanas y latinoamericanas a texto completo. Un jurado peruano
      espera ver literatura regional, y las bases anglosajonas no la indexan
      bien. *Anales de la Facultad de Medicina* de la UNMSM está en SciELO, y es
      la revista cuyo formato de resumen exige el reglamento de esa facultad.
    relacionado: [alicia, cybertesis]

  # ===========================================================================
  # Centros de investigación, gremios y encuestadoras del Perú
  #
  # Producen datos y estudios que no son oficiales pero sí citables, y que a
  # menudo cubren lo que el Estado no mide.
  # ===========================================================================

  - id: grade
    nombre: GRADE — Grupo de Análisis para el Desarrollo
    url: https://www.grade.org.pe/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: continua
    desagregacion: [según el estudio]
    facultades: [Ciencias Económicas, Educación, Ciencias Sociales, Psicología]
    notas: >-
      El centro de investigación económica y social más citado del Perú.
      Coordina **Niños del Milenio** —el panel longitudinal— y publica documentos
      de investigación con sus bases de datos en varios casos.

      Para antecedentes de una tesis peruana en economía, educación o pobreza,
      es el primer sitio donde mirar después de Cybertesis.
    relacionado: [young_lives]

  - id: think_tanks_peru
    nombre: Centros de investigación y observatorios peruanos
    url: https://cies.org.pe/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: continua
    desagregacion: [según la institución]
    facultades: [Ciencias Económicas, Ciencias Sociales, Derecho y Ciencia Política,
                 Ciencias Administrativas, Educación]
    entidades:
      - {sigla: CIES, url: "https://cies.org.pe/",
         usos: "consorcio de 48 instituciones; concursos y documentos de investigación"}
      - {sigla: IEP, url: "https://iep.org.pe/",
         usos: "estudios sociales y políticos; encuestas de opinión con El Comercio"}
      - {sigla: IPE, url: "https://www.ipe.org.pe/",
         usos: "índice de competitividad regional (INCORE), indicadores económicos regionales"}
      - {sigla: ComexPerú, url: "https://www.comexperu.org.pe/",
         usos: "semanario con datos de comercio exterior y empleo formal"}
      - {sigla: CIUP, url: "https://ciup.up.edu.pe/",
         usos: "investigación de la Universidad del Pacífico"}
      - {sigla: Proética, url: "https://www.proetica.org.pe/",
         usos: "Encuesta Nacional sobre Percepciones de la Corrupción"}
      - {sigla: "Lima Cómo Vamos", url: "https://www.limacomovamos.org/",
         usos: "encuesta anual de percepción sobre calidad de vida urbana en Lima y Callao"}
    notas: >-
      No son fuentes oficiales, y eso hay que decirlo al citarlos: sus encuestas
      no tienen la representatividad ni la metodología publicada de una del
      INEI. A cambio, miden cosas que el Estado no mide —percepción de
      corrupción, calidad de vida urbana, competitividad regional— y publican
      rápido.

      El **INCORE del IPE** es especialmente útil: da un índice de
      competitividad por región con sus componentes, listo para usar como
      variable en un análisis regional.


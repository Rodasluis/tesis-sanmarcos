      - {nombre: Datum Internacional, url: "https://www.datum.com.pe/",
         usos: "encuestas de opinión y estudios sociales"}
    notas: >-
      Publican fichas técnicas con muestra, margen de error y fechas de campo:
      **sin esa ficha, una encuesta no se cita**. Las series mensuales de
      aprobación o de expectativas sirven como variable de contexto.

      Limitación que hay que declarar: muchas son urbanas o solo de Lima, y las
      bases de datos rara vez se publican. Se cita el reporte, no los
      microdatos.


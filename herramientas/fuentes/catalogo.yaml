      **Atención:** cualquier base con datos de pacientes, aunque venga
      anonimizada, exige el tratamiento de la Ley N.° 29733, y una tesis con
      datos clínicos primarios necesita comité de ética (ver el perfil de tu
      facultad).
    relacionado: [datos_abiertos_peru]


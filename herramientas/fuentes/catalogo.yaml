  - id: reniec
    nombre: RENIEC — estadísticas agregadas
    url: https://www.reniec.gob.pe/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: variable
    desagregacion: [departamento, provincia, distrito]
    facultades: [Ciencias Sociales, Derecho y Ciencia Política, Ciencias Económicas]
    notas: >-
      Solo estadísticas agregadas. RENIEC **no** entrega datos individuales para
      una tesis, y pedirlos o usarlos sería tratamiento de datos personales sin
      base legal.

  # ===========================================================================
  # Encuestas y datos de organismos supervisores y ministerios
  #
  # No todo lo que se encuesta en el Perú lo encuesta el INEI. Los reguladores
  # levantan sus propias encuestas sectoriales, y suelen ser poco conocidas
  # justamente porque no están en el portal del INEI. Para una tesis de
  # Economía, Administración, Ingeniería o Derecho, muchas veces son mejores que
  # la ENAHO: preguntan exactamente por el sector.
  # ===========================================================================

  - id: sbs
    nombre: SBS — Superintendencia de Banca, Seguros y AFP
    url: https://www.sbs.gob.pe/
    url_encuestas: https://www.sbs.gob.pe/inclusion-financiera-principal/cifras-de-inclusion-financiera/encuestas
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: [mensual para las series, puntual para las encuestas]
    desagregacion: [entidad financiera, departamento, urbano-rural]
    facultades: [Ciencias Económicas, Ciencias Administrativas, Ciencias Contables]
    encuestas:
      - nombre: Encuesta Nacional de Demanda de Servicios Financieros e Inclusión Financiera
        usos: "acceso y uso de servicios financieros, barreras, ahorro dentro y fuera del sistema"
        nota: >-
          Hecha con la Cooperación Suiza (SECO). La de 2015-2016 encuestó a
          6565 personas de 18 a 70 años en los 24 departamentos y el Callao.
      - nombre: Encuesta de Medición de Capacidades Financieras
        usos: "conocimientos, actitudes y comportamientos financieros"
        nota: "metodología OCDE/INFE, comparable con otros países"
    series:
      - "Indicadores de inclusión financiera: puntos de atención, deudores, depósitos por distrito"
      - "Boletines estadísticos del sistema financiero, de seguros y de AFP"
    notas: >-
      **La fuente peruana sobre inclusión financiera**, y poco usada en tesis de
      pregrado precisamente porque no está en el INEI.

      Dos cosas distintas conviven aquí: las **encuestas de demanda**, que miran
      a las personas, y las **series de oferta**, que miran a las entidades
      —cuántos cajeros, cuántos deudores, cuánto depósito por distrito—.
      Cruzarlas es lo que hace interesante una tesis de inclusión financiera: la
      brecha entre lo que hay y lo que la gente usa.

      Las series llegan a nivel distrital, que es una desagregación difícil de
      conseguir en el Perú.
    descarga_manual: >-
      1. Encuestas: https://www.sbs.gob.pe/inclusion-financiera-principal/cifras-de-inclusion-financiera/encuestas
      2. Series: portal de estadísticas de la SBS, boletín estadístico.
      3. Guarda los archivos en `datos/crudos/` y anota el periodo.

  - id: produce
    nombre: PRODUCE — Ministerio de la Producción
    url: https://www.gob.pe/produce
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: anual
    desagregacion: [empresa, sector, tamaño, región]
    facultades: [Ciencias Económicas, Ciencias Administrativas, Ciencias Contables,

# ===========================================================================
# Reglas de uso, para cualquier fuente
# ===========================================================================
reglas:
  - >-
    Lo descargado va a `datos/crudos/` **sin modificar**, y ahí se queda. Toda
    limpieza produce un archivo nuevo en `datos/procesados/` y deja el código
    que la hizo en `codigo/`. Sin eso, nadie puede reproducir el resultado, ni
    siquiera tú dentro de seis meses.
  - >-
    De cada descarga se anota la fecha y los filtros exactos. Los portales
    públicos corrigen sus series hacia atrás sin avisar, y una cifra que hoy no
    cuadra con tu texto puede ser eso.
  - >-
    Si la encuesta tiene factor de expansión, se usa. Un promedio sin ponderar
    de la ENAHO no describe al Perú, describe a la muestra.
  - >-
    Ninguna cifra llega al texto escrita a mano: sale de `resultados/` por una
    expresión de Quarto. Lo comprueba `verificar_cifras.py`.
  - >-
    Datos de personas identificables: se anonimizan antes de salir de
    `datos/crudos/` y nunca se suben al remoto (Ley N.° 29733 y
    DS N.° 016-2024-JUS). El hook de git lo bloquea, pero la responsabilidad
    es tuya.

      - {nombre: "Estadísticas pesqueras y acuícolas", usos: "desembarque, producción, precios"}
    notas: >-
      El subdominio de su oficina de estudios (ogeiee.produce.gob.pe) **no
      respondió** en la comprobación; se llega por gob.pe y por la Plataforma
      Nacional de Datos Abiertos, donde PRODUCE tiene su propio grupo.

      Ojo con la unidad: casi todo lo de PRODUCE es **empresa formal**. Si la
      pregunta es sobre informalidad, esta fuente describe justamente lo que
      queda fuera del problema, y hay que decirlo.
    relacionado: [datos_abiertos_peru, inei_microdatos]

  - id: osiptel
    nombre: OSIPTEL — Organismo Supervisor de la Inversión Privada en Telecomunicaciones
    url: https://repositorio.osiptel.gob.pe/
    api: https://repositorio.osiptel.gob.pe/oai/request?verb=ListSets
    estado: api_verificada
    tipo_acceso: api
    frecuencia: [anual para ERESTEL, trimestral para indicadores]
    desagregacion: [hogar, departamento, urbano-rural, operador]
    facultades: [Ciencias Económicas, Ingeniería de Sistemas e Informática,
                 Ingeniería Electrónica y Eléctrica, Ciencias Sociales,
                 Ciencias Administrativas]
    encuestas:
      - sigla: ERESTEL
        nombre: Encuesta Residencial de Servicios de Telecomunicaciones
        usos: "acceso y uso de telefonía fija y móvil, internet y TV de paga en los hogares"
        nota: >-
          La única encuesta dedicada a servicios de telecomunicaciones en el
          Perú. La de 2022 llegó a 15 493 hogares. Hay ediciones desde 2013 y se
          ha usado en estudios con microdatos.
    notas: >-
      Su repositorio es un DSpace con **OAI-PMH funcionando**, lo que permite
      recorrer el catálogo por programa. La API REST moderna devolvió 404: es
      una versión anterior de DSpace. Para cosechar, usa OAI:
      `?verb=ListRecords&metadataPrefix=oai_dc`.

      Para una tesis sobre brecha digital, ERESTEL es mejor que la ENAHO: la
      ENAHO pregunta si hay internet en el hogar; ERESTEL pregunta por
      velocidad, operador, gasto, motivos de no contratación y uso efectivo.
    ejemplo: https://repositorio.osiptel.gob.pe/oai/request?verb=ListSets

  - id: osinergmin
    nombre: OSINERGMIN — Organismo Supervisor de la Inversión en Energía y Minería
    url: https://www.gob.pe/institucion/osinergmin/colecciones/1591-encuesta-residencial-de-consumo-y-usos-de-energia
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: "irregular; hay ediciones de 2007 a 2024"
    desagregacion: [hogar, departamento, urbano-rural]
    facultades: [Ciencias Económicas, Ingeniería Electrónica y Eléctrica,
                 Ingeniería Geológica Minera Metalúrgica y Geográfica,
                 Ciencias Sociales]
    encuestas:
      - sigla: ERCUE
        nombre: Encuesta Residencial de Consumo y Usos de Energía
        usos: >-
          patrones de consumo de electricidad, GLP, leña y otras fuentes;
          brechas de acceso; relación con la condición socioeconómica del hogar
    notas: >-
      Para pobreza energética, cocinas limpias o transición energética en
      hogares, es la fuente. Las ediciones están publicadas como informes en
      gob.pe; los microdatos no siempre, así que conviene mirar la ficha de cada
      año antes de prometer un análisis a nivel de hogar.
    descarga_manual: >-
      1. Entra a la colección de ERCUE en gob.pe.
      2. Elige la edición y descarga el informe y, si está, la base.
      3. Anota en `datos/crudos/_procedencia.md` qué edición y qué contiene.

  - id: smv
    nombre: SMV — Superintendencia del Mercado de Valores
    url: https://www.smv.gob.pe/
    url_estados_financieros: https://www.smv.gob.pe/Frm_InformacionFinanciera.aspx
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: trimestral
    desagregacion: [empresa, sector]
    facultades: [Ciencias Contables, Ciencias Administrativas, Ciencias Económicas]
    notas: >-
      **Estados financieros auditados de las empresas que cotizan**, en formato
      estructurado y por trimestre. Para una tesis de Contabilidad o Finanzas es
      la fuente natural: ratios, estructura de capital, rentabilidad, gobierno
      corporativo.

      Limitación que hay que declarar: solo cubre empresas listadas, que en el
      Perú son pocas y grandes. Ninguna conclusión sobre "las empresas
      peruanas" se sostiene con esta muestra.

  - id: sunat
    nombre: SUNAT — estadísticas y estudios tributarios
    url: https://www.sunat.gob.pe/estadisticasestudios/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: mensual
    desagregacion: [tributo, sector económico, departamento, tamaño de contribuyente]
    facultades: [Ciencias Contables, Ciencias Económicas, Ciencias Administrativas,
                 Derecho y Ciencia Política]
    notas: >-
      Las "notas tributarias" traen recaudación por tributo, por sector y por
      región, en series mensuales largas. También padrón de contribuyentes y
      estadísticas de comercio exterior.

      Son datos **agregados**. SUNAT no entrega información individual de
      contribuyentes, y pedirla o usarla sería ilegal además de imposible.

  - id: mtpe
    nombre: MTPE — estadísticas laborales
    url: https://www2.trabajo.gob.pe/estadisticas/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: mensual
    desagregacion: [empresa, sector, región, tamaño]
    facultades: [Ciencias Económicas, Ciencias Administrativas, Ciencias Sociales,
                 Derecho y Ciencia Política, Ingeniería Industrial]
    conjuntos:
      - {nombre: "Planilla Electrónica", usos: "empleo formal privado, remuneraciones, rotación"}
      - {nombre: "Encuesta Nacional de Variación Mensual del Empleo (ENVME)",
         usos: "empleo en empresas de 10 y más trabajadores"}
      - {nombre: "Anuario estadístico sectorial", usos: "series laborales consolidadas"}
    notas: >-
      La Planilla Electrónica es un **registro administrativo**, no una
      encuesta: cubre el universo del empleo formal privado, sin error muestral
      pero también sin nada de lo informal. Para el Perú esa omisión es enorme,
      y hay que decirlo al interpretar.

      Complementa bien a la ENAHO: la ENAHO ve a toda la fuerza laboral con
      muestra; la Planilla ve solo la parte formal, pero entera.

  - id: sunass
    nombre: SUNASS — Superintendencia Nacional de Servicios de Saneamiento
    url: https://www.sunass.gob.pe/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: anual
    desagregacion: [empresa prestadora, localidad]
    facultades: [Ingeniería Geológica Minera Metalúrgica y Geográfica,
                 Ciencias Económicas, Ciencias Sociales, Ingeniería Industrial]
    notas: >-
      Benchmarking de las empresas prestadoras de servicios de saneamiento:
      cobertura, continuidad, presión, agua no facturada, tarifas, indicadores
      de gestión. Serie larga y comparable entre EPS.

      Para tesis sobre acceso al agua, gestión de servicios públicos o
      eficiencia de empresas públicas.

  - id: senamhi
    nombre: SENAMHI — datos hidrometeorológicos
    url: https://www.senamhi.gob.pe/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: diaria
    desagregacion: [estación, cuenca, distrito]
    facultades: [Ciencias Físicas, Ingeniería Geológica Minera Metalúrgica y Geográfica,
                 Ciencias Biológicas, Ciencias Económicas]
    notas: >-
      Temperatura, precipitación, caudales, por estación y día. Base de
      cualquier tesis que cruce clima con producción agrícola, salud o
      desastres.

      Las estaciones tienen huecos y cambian de ubicación: comprueba la
      continuidad de la serie antes de construir el análisis encima.

  - id: infogob
    nombre: INFOgob — Observatorio para la Gobernabilidad (JNE)
    url: https://infogob.jne.gob.pe/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: por proceso electoral
    desagregacion: [distrito, provincia, región, organización política, candidato]
    facultades: [Derecho y Ciencia Política, Ciencias Sociales, Ciencias Económicas]
    notas: >-
      Resultados electorales, autoridades electas, hojas de vida de candidatos y
      organizaciones políticas, desde 1963. Para Ciencia Política es la fuente
      central, y permite cruzar con datos de gasto público por distrito.

  - id: inpe
    nombre: INPE — estadística penitenciaria
    url: https://www.gob.pe/inpe
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: mensual
    desagregacion: [establecimiento penitenciario, delito, situación jurídica, región]
    facultades: [Derecho y Ciencia Política, Ciencias Sociales, Psicología]
    notas: >-
      Informes estadísticos mensuales con población penal por establecimiento,
      delito, situación jurídica, edad y sexo. Para tesis sobre hacinamiento,
      prisión preventiva o reincidencia.

  - id: poder_judicial
    nombre: Poder Judicial — estadística judicial
    url: https://www.pj.gob.pe/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: anual
    desagregacion: [distrito judicial, materia, instancia]
    facultades: [Derecho y Ciencia Política, Ciencias Sociales]
    notas: >-
      Carga procesal, expedientes resueltos y pendientes, por distrito judicial
      y materia. Para tesis sobre acceso a la justicia o demora judicial.

      Hay también jurisprudencia sistematizada, que en Derecho es **corpus**, no
      dato estadístico, y se cita como fuente primaria.

  - id: sectoriales_gobpe
    nombre: Ministerios y organismos sectoriales (vía gob.pe)
    url: https://www.gob.pe/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: variable
    desagregacion: [variable]
    facultades: [todas]
    entidades:
      - {sigla: MIDIS, url: "https://www.gob.pe/midis",
         usos: "padrones y evaluaciones de programas sociales (Juntos, Pensión 65, Qali Warma)"}
      - {sigla: MINEM, url: "https://www.gob.pe/minem",
         usos: "producción minera y energética, inversión, canon"}
      - {sigla: MINCETUR, url: "https://www.gob.pe/mincetur",
         usos: "turismo receptivo e interno, comercio exterior"}
      - {sigla: MIDAGRI, url: "https://www.gob.pe/midagri",
         usos: "producción agropecuaria, precios en chacra, SIEA"}
      - {sigla: MTC, url: "https://www.gob.pe/mtc",
         usos: "infraestructura vial, parque automotor, accidentes de tránsito"}
      - {sigla: INDECOPI, url: "https://www.gob.pe/indecopi",
         usos: "reclamos de consumidores, propiedad intelectual, competencia"}
      - {sigla: OEFA, url: "https://www.gob.pe/oefa",
         usos: "supervisión y fiscalización ambiental, sanciones"}
    notas: >-
      Todos publican en «Informes y publicaciones» de gob.pe, con calidad y
      periodicidad desiguales. Sus dominios propios fallan a menudo —INDECOPI y
      OEFA no respondieron en la comprobación, ONPE devolvió 403— pero sus
      fichas de gob.pe sí.

      **Antes de ir al ministerio, mira dos sitios:** el portal de microdatos del
      INEI, por si la encuesta del sector la ejecuta el INEI por encargo, y la
      Plataforma Nacional de Datos Abiertos, donde muchos publican ya
      consolidado.
    relacionado: [inei_microdatos, datos_abiertos_peru]

  # ===========================================================================
  # Microdatos internacionales que incluyen al Perú
  #
  # Casi no se usan en tesis de pregrado y son gratuitos. Varios permiten algo
  # que ninguna fuente peruana da: comparar al Perú con países parecidos con la
  # misma medición, o seguir a las mismas personas durante veinte años.
  # ===========================================================================

  - id: bm_microdatos
    nombre: Banco Mundial — Microdata Library
    url: https://microdata.worldbank.org/index.php/catalog
    api: https://microdata.worldbank.org/index.php/api/catalog/search?country[]=Peru
    estado: api_verificada
    tipo_acceso: api
    frecuencia: continua
    desagregacion: [hogar, persona, empresa, según la encuesta]
    facultades: [Ciencias Económicas, Ciencias Sociales, Educación,
                 Ciencias Administrativas, Medicina, Psicología]
    notas: >-
      Catálogo de miles de encuestas de todo el mundo, con **microdatos
      descargables** tras registro gratuito. Para el Perú tiene encuestas de
      hogares, de empresas y estudios temáticos que no están en el portal del
      INEI.

      La API devuelve el catálogo en JSON; la descarga de los datos sí requiere
      cuenta y aceptar las condiciones de uso de cada encuesta. Esas condiciones
      hay que leerlas: algunas prohíben redistribuir los microdatos, lo que
      significa que no se suben al repositorio aunque estén en `datos/crudos/`.
    ejemplo: https://microdata.worldbank.org/index.php/api/catalog/search?country[]=Peru&ps=5

  - id: dhs
    nombre: DHS Program — Demographic and Health Surveys
    url: https://dhsprogram.com/data/available-datasets.cfm
    api: https://api.dhsprogram.com/rest/dhs/
    estado: api_verificada
    tipo_acceso: api
    frecuencia: "por encuesta; el Perú tiene ediciones desde 1986"
    desagregacion: [nacional, región, urbano-rural, quintil de riqueza]
    facultades: [Medicina, Psicología, Ciencias Sociales, Educación,
                 Ciencias Económicas, Farmacia y Bioquímica]
    notas: >-
      **La ENDES peruana es parte del programa DHS.** Eso tiene dos
      consecuencias que casi nadie aprovecha en una tesis de pregrado:

      1. Los indicadores de la ENDES están disponibles por **API**, ya
         calculados y comparables entre años, sin tener que procesar los
         microdatos. Se comprobó: devuelve series del Perú desde 1986.
      2. Son **comparables con otros países** que usan el mismo cuestionario.
         Una tesis sobre desnutrición infantil puede poner al Perú al lado de
         Bolivia, Colombia o Guatemala con la misma medición, que es algo que la
         ENAHO no permite.

      Los microdatos requieren registro gratuito y aprobación de un proyecto de
      investigación, que suele tardar pocos días. Para los indicadores agregados
      la API no pide nada.
    ejemplo: https://api.dhsprogram.com/rest/dhs/data?countryIds=PE&indicatorIds=CN_NUTS_C_HA2&f=json
    relacionado: [inei_microdatos]

  - id: bm_enterprise_surveys
    nombre: Banco Mundial — Enterprise Surveys
    url: https://www.enterprisesurveys.org/en/data/exploreeconomies/2017/peru
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: "irregular; el Perú tiene ediciones de 2006, 2010 y 2017"
    desagregacion: [empresa, sector, tamaño, región]
    facultades: [Ciencias Administrativas, Ciencias Económicas, Ciencias Contables,
                 Ingeniería Industrial]
    notas: >-
      Encuesta a empresas con cuestionario estandarizado internacionalmente:
      acceso al crédito, corrupción, infraestructura, informalidad, innovación,
      obstáculos percibidos. Permite comparar al Perú con la región usando la
      misma pregunta, cosa que la ENE del INEI no permite.

      Microdatos gratuitos tras registro.
    relacionado: [bm_microdatos, produce]

  - id: young_lives
    nombre: Young Lives / Niños del Milenio — estudio longitudinal
    url: https://www.younglives.org.uk/
    url_peru: https://ninosdelmilenio.org/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: "rondas cada 3 a 4 años desde 2002"
    desagregacion: [niño, hogar, comunidad]
    facultades: [Educación, Psicología, Ciencias Sociales, Ciencias Económicas,
                 Medicina]
    notas: >-
      **Lo más valioso que existe para el Perú y lo menos usado en tesis de
      pregrado: un panel que sigue a las mismas personas desde 2002.** Dos
      cohortes de niños, seguidas más de veinte años, con datos de educación,
      salud, nutrición, trabajo infantil, aspiraciones y transición a la vida
      adulta.

      Es longitudinal de verdad: permite preguntas que ninguna encuesta de corte
      transversal admite —qué pasó con los niños desnutridos a los 8 años cuando
      llegaron a los 22—. En el Perú lo coordina GRADE.

      Los datos se descargan del UK Data Service con registro gratuito.
    descarga_manual: >-
      1. Regístrate en el UK Data Service.
      2. Busca la serie «Young Lives».
      3. Descarga las rondas del Perú y sus cuestionarios.
      4. Guarda en `datos/crudos/` y anota la ronda y la versión.
    relacionado: [grade]

  - id: ipums
    nombre: IPUMS International — microdatos censales armonizados
    url: https://international.ipums.org/international/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: por censo
    desagregacion: [persona, hogar, región]
    facultades: [Ciencias Sociales, Ciencias Económicas, Educación]
    notas: >-
      Muestras de censos de todo el mundo con **variables armonizadas**: la
      misma variable significa lo mismo en el censo peruano de 1993 y en el de
      2017, y también en el chileno. Eso ahorra el trabajo más pesado de un
      análisis censal comparado.

      Gratuito con registro y compromiso de citar. Requiere declarar el uso
      previsto.

  - id: encuestas_regionales_comparadas
    nombre: Encuestas regionales comparadas (LAPOP, Latinobarómetro, WVS)
    url: https://www.vanderbilt.edu/lapop/
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: "bienal o irregular, según el proyecto"
    desagregacion: [persona, región]
    facultades: [Derecho y Ciencia Política, Ciencias Sociales, Psicología,
                 Ciencias Económicas, Educación]
    proyectos:
      - {nombre: "Barómetro de las Américas (LAPOP)", url: "https://www.vanderbilt.edu/lapop/",
         usos: "cultura política, confianza en instituciones, corrupción, apoyo a la democracia"}
      - {nombre: "Latinobarómetro", url: "https://www.latinobarometro.org/latContents.jsp",
         usos: "opinión pública regional, serie desde 1995"}
      - {nombre: "World Values Survey", url: "https://www.worldvaluessurvey.org/wvs.jsp",
         usos: "valores, religiosidad, confianza interpersonal"}
    notas: >-
      Las tres tienen microdatos gratuitos y cubren al Perú con series largas.
      Para una tesis sobre confianza institucional, percepción de corrupción o
      cultura política son mejores que cualquier fuente oficial, porque lo
      oficial no pregunta por eso.

      Ventaja compartida: permiten decir si el Perú se parece o no a la región,
      con la misma pregunta y el mismo año.

  # ===========================================================================
  # APIs de organismos internacionales
  # ===========================================================================

  - id: who_gho
    nombre: OMS — Global Health Observatory
    url: https://www.who.int/data/gho
    api: https://ghoapi.azureedge.net/api/
    estado: api_verificada
    tipo_acceso: api
    frecuencia: anual
    desagregacion: [pais, sexo, grupo de edad]
    facultades: [Medicina, Farmacia y Bioquímica, Odontología, Psicología,
                 Medicina Veterinaria]
    notas: >-
      API OData sin clave. Indicadores de salud comparables entre países:
      mortalidad, cobertura de servicios, factores de riesgo, recursos humanos
      en salud. Útil para situar al Perú en el capítulo de antecedentes.
    ejemplo: https://ghoapi.azureedge.net/api/Indicator

  - id: ilostat
    nombre: OIT — ILOSTAT
    url: https://ilostat.ilo.org/
    api: https://rplumber.ilo.org/data/indicator/
    estado: api_verificada
    tipo_acceso: api
    frecuencia: anual y trimestral
    desagregacion: [pais, sexo, edad, rama de actividad]
    facultades: [Ciencias Económicas, Ciencias Administrativas, Ciencias Sociales,
                 Derecho y Ciencia Política, Ingeniería Industrial]
    notas: >-
      Indicadores laborales comparables internacionalmente, construidos a partir
      de las encuestas nacionales —en el caso peruano, de la ENAHO—. Sirve para
      contrastar: si tu cálculo con la ENAHO difiere mucho del de ILOSTAT,
      probablemente tu definición de empleo no es la estándar.
    ejemplo: https://rplumber.ilo.org/data/indicator/?id=UNE_DEAP_SEX_AGE_RT_A&ref_area=PER&format=.json

  - id: unesco_uis
    nombre: UNESCO — Instituto de Estadística (UIS)
    url: https://uis.unesco.org/
    api: https://api.uis.unesco.org/api/public/
    estado: api_verificada
    tipo_acceso: api
    frecuencia: anual
    desagregacion: [pais, nivel educativo, sexo]
    facultades: [Educación, Ciencias Sociales, Ciencias Económicas]
    notas: >-
      Indicadores educativos comparables: matrícula, finalización, gasto por
      alumno, docentes. Complementa a ESCALE, que da el detalle peruano pero no
      permite comparar.
    ejemplo: https://api.uis.unesco.org/api/public/definitions/indicators

  - id: comtrade
    nombre: UN Comtrade — comercio internacional
    url: https://comtradeplus.un.org/
    api: https://comtradeapi.un.org/public/v1/preview/
    estado: api_verificada
    tipo_acceso: api
    frecuencia: anual y mensual
    desagregacion: [producto HS, socio comercial, flujo]
    facultades: [Ciencias Económicas, Ciencias Administrativas, Ciencias Contables]
    notas: >-
      Exportaciones e importaciones por producto y socio. La vista `preview`
      funciona sin clave pero limita el número de registros; para descargas
      grandes hace falta registrarse.

      Para el Perú, contrastar con las estadísticas de SUNAT: las cifras espejo
      —lo que el Perú dice exportar contra lo que el socio dice importar— son en
      sí mismas un objeto de estudio.
    ejemplo: https://comtradeapi.un.org/public/v1/preview/C/A/HS?reporterCode=604&period=2022&cmdCode=TOTAL&flowCode=X
    relacionado: [sunat, oec]

  - id: owid
    nombre: Our World in Data
    url: https://ourworldindata.org/
    api: https://ourworldindata.org/grapher/{indicador}.csv?country=PER
    estado: api_verificada
    tipo_acceso: api
    frecuencia: variable
    desagregacion: [pais]
    facultades: [todas]
    notas: >-
      Cada gráfico publicado tiene una versión descargable en CSV añadiendo
      `.csv` a su URL y filtrando por país. Es la forma más rápida de conseguir
      una serie internacional limpia y citable para el capítulo de antecedentes.

      La API de indicadores por identificador numérico devolvió 404; lo que
      funciona es la ruta del gráfico.
    ejemplo: https://ourworldindata.org/grapher/gdp-per-capita-worldbank.csv?country=PER

  - id: doaj
    nombre: DOAJ — Directory of Open Access Journals
    url: https://doaj.org/
    api: https://doaj.org/api/search/
    estado: api_verificada
    tipo_acceso: api
    frecuencia: continua
    desagregacion: [revista, artículo, país]
    facultades: [todas]
    notas: >-
      Catálogo de revistas y artículos de acceso abierto, con API sin clave.
      Útil para comprobar que una revista donde se piensa publicar es seria, y
      para encontrar literatura abierta cuando la biblioteca no tiene acceso.
    ejemplo: https://doaj.org/api/search/journals/peru?pageSize=5

  - id: faostat
    nombre: FAO — FAOSTAT
    url: https://www.fao.org/faostat/es/
    api: https://bulks-faostat.fao.org/production/datasets_E.json
    estado: api_verificada
    tipo_acceso: api
    frecuencia: anual
    desagregacion: [pais, producto, año]
    facultades: [Ciencias Biológicas, Medicina Veterinaria, Ciencias Económicas,
                 Farmacia y Bioquímica]
    notas: >-
      Producción agropecuaria, seguridad alimentaria, uso de la tierra, precios.

      **La API principal (fenixservices) devolvió 521**, que es un error de
      origen: estaba caída. Lo que sí respondió es el catálogo de descargas
      masivas, que funciona igual de bien para una tesis: se baja el conjunto
      completo y se filtra por Perú en local.
    ejemplo: https://bulks-faostat.fao.org/production/datasets_E.json

  - id: oec
    nombre: OEC — Observatory of Economic Complexity
    url: https://oec.world/en/profile/country/per
    estado: manual_verificada
    tipo_acceso: manual
    frecuencia: anual
    desagregacion: [producto, socio comercial]
    facultades: [Ciencias Económicas, Ciencias Administrativas]
    notas: >-
      Visualizaciones y datos de complejidad económica y canasta exportadora.
      Útil para el capítulo de contexto de una tesis sobre comercio o
      diversificación productiva. La descarga masiva requiere cuenta de pago;
      lo visible y citable es gratuito.
    relacionado: [comtrade]

  - id: undp_hdr
    nombre: PNUD — Informe sobre Desarrollo Humano
    url: https://hdr.undp.org/data-center/documentation-and-downloads
    api: https://hdrdata.org/api/
    estado: verificar
    tipo_acceso: manual
    frecuencia: anual
    desagregacion: [pais, y en algunos informes, región subnacional]
    facultades: [Ciencias Sociales, Ciencias Económicas, Educación]
    notas: >-
      La API pide clave («Please provide API key»), así que queda como
      descarga manual mientras no se gestione una. Los archivos del centro de
      datos sí se bajan sin registro.

      Para el Perú hay informes nacionales con **IDH a nivel distrital**, que es
      una desagregación muy útil y difícil de conseguir.

  - id: semantic_scholar
    nombre: Semantic Scholar — API académica
    url: https://www.semanticscholar.org/
    api: https://api.semanticscholar.org/graph/v1/
    estado: api_bloqueada
    tipo_acceso: manual
    frecuencia: continua
    desagregacion: [artículo, autor, cita]
    facultades: [todas]
    notas: >-
      Devolvió 429 («Too Many Requests») sin clave. La API existe y es buena
      —da citas entrantes y salientes, útil para rastrear quién discute a
      quién—, pero para usarla con regularidad hace falta pedir una clave
      gratuita. Mientras tanto, OpenAlex cubre lo mismo sin límite agresivo.
    relacionado: [alicia]

  - id: scielo_redalyc

      nivel: pregrado
      url: https://letras.unmsm.edu.pe/wp-content/uploads/2021/04/2021_R.D-000057-D-FLCH-2021-Instructivo-Trabajo-de-investigacio%CC%81n_Tesis_RD_final.pdf
      archivo_local: letras-y-ciencias-humanas/RD_000057-2021-D-FLCH_instructivo_TI_tesis.pdf
      estado: verificado
    documentos_complementarios:
      - {nombre: Directiva sobre procedimiento de sustentación de tesis de pregrado,
         norma: RR N.° 009747-2022-R,
         archivo_local: letras-y-ciencias-humanas/RR_009747-2022-R_sustentacion_tesis_pregrado_FLCH.pdf,

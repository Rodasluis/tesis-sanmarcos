      estilo_citas: apa7           # «estilo APA (7.ª ed.)», §9
      fuente: [Arial, Times New Roman]
      tamano: 12
      interlineado: 1.5
      referencias_interlineado: simple
      resumen: {palabras_clave: true, linea_investigacion: true, abstract: true}
      modelos: [cuantitativa, cualitativa]
    esquema_de_facto: letras-y-ciencias-humanas/esquema_de_facto.md
    nota: >-
      Reemplaza como fuente al dictamen de posgrado de la UPG de Letras que
      mencionaba la especificación: este es de PREGRADO y por tanto es el
      pertinente. Tiene erratas de numeración (salta 2.2; rotula «V.
      CONCLUSIONES» tras el capítulo V) que se normalizan en

relevamiento_fase_7:
  fecha: 2026-10-11
  objetivo: localizar norma propia para las 15 facultades que heredan la general
  resultado: 1 encontrada (Ciencias Administrativas), 14 siguen heredando
  que_se_probo:
  - búsqueda web restringida a unmsm.edu.pe por facultad y por el patrón «resolución rectoral que aprueba
    reglamento de grados y títulos»
  - sondeo HTTP de /normativa/ y /normatividad/ en los 20 dominios de facultad
  - sondeo HTTP de /documentos, /transparencia, /grados-y-titulos y /reglamentos
  paginas_que_respondieron:
    normativa:
    - administracion.unmsm.edu.pe
    - veterinaria.unmsm.edu.pe
    transparencia:
    - figmmg
    - quimica
    - fisica
    - biologia
    - farmacia
    - odontologia
  hallazgos_negativos:
  - veterinaria.unmsm.edu.pe/documentos publica el Reglamento General de Grados y Títulos de la UNMSM
    (RR N.° 01827-R-17), que es el general y no uno propio
  - industrial.unmsm.edu.pe publica un modelo de tesis con código de documento (FII17-R-M003 v03, 2024)
    pero su servidor rechazó la conexión; sin leerlo no se puede saber si acredita rango normativo
  - los portales de transparencia de las seis facultades son índices de categorías, sin normativa de tesis
    en la portada
  leccion: 'Lo que distingue a las facultades con norma propia encontrada no es que la tengan: es dónde
    la publican. Las cuatro verificadas aparecen porque alguien enlazó el PDF desde una página indexable.
    Buscar por «resolución rectoral que aprueba» rinde más que buscar por facultad, porque las directivas
    de facultad se ratifican por RR.'
  decision_posterior:
    fecha: 2026-10-23
    que: Economía y Educación pasan a `hereda_general`. Con eso quedan 4 facultades con norma propia verificada
      y 16 que heredan la general.
    por_que: 'Los estados intermedios —`verificar` y `solo_fuente_secundaria`— obligaban a advertir en
      cada etapa sobre documentos que no acreditan rango normativo y que, en el caso de Economía, ni siquiera
      cambian la estructura de la tesis. Heredar la norma general no es un vacío: los Anexos 2A y 2B son
      norma.'

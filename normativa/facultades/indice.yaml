relevamiento:
  fecha: 2026-09-16
  metodo:
  - rastreo de los sitios web de las 20 facultades
  - consultas al buscador restringidas a unmsm.edu.pe
  - cosecha de 100 tesis de pregrado (5 por facultad) desde Cybertesis mediante su API DSpace 7.6.2 en
    https://cybertesis.unmsm.edu.pe/backend/api
  cobertura: 20 de 20 facultades
norma_general:
  documento: Directiva general para realizar, presentar y sustentar el trabajo de investigación para la
    obtención del grado académico de bachiller, la tesis o el trabajo de suficiencia profesional para
    la obtención del título profesional en la UNMSM
  norma: RR N.° 00744-R-20
  fecha: 2020-02-18
  url: https://viceacademico.unmsm.edu.pe/wp-content/uploads/2020/02/ANEXO-RR-00744-R-200001.pdf
  archivo_local: ../RR_00744-2020-R_ANEXO_directiva_general_tesis.pdf
  estado: verificado
  capa_de_texto: false
  anexos_pertinentes:
  - id: 2A
    titulo: Estructura general de la tesis para título
    pagina: 13
    fija:
    - preliminares en números romanos minúsculos
    - 'carátula: escudo, facultad, EP, título, mención del título profesional, autor, asesor, fecha (mes
      y año)'
    - resumen y abstract de 200 palabras
    - 5 palabras clave y keywords
    - acta de sustentación
    - dedicatoria y agradecimiento opcionales
    - 'información complementaria: DNI, correo del asesor, grupo de investigación, fuente de financiamiento,
      disciplina OCDE, título en inglés o quechua'
    - 'estilo de citas: «según los estilos de cita-referencia de acuerdo a las áreas del conocimiento»
      (no fija uno solo)'
  - id: 2B
    titulo: Estructura del cuerpo de la tesis
    pagina: 14
    modelos:
      modelo_1_cuantitativa:
      - I. Introducción
      - II. Revisión de literatura
      - III. Hipótesis y variables
      - IV. Materiales y métodos
      - V. Resultados
      - VI. Discusión
      - VII. Conclusiones y recomendaciones
      modelo_2_cualitativa:
      - I. Introducción
      - II. Revisión de literatura
      - III. Hipótesis y variables
      - IV. Materiales y métodos
      - V. Resultados
      - VI. Discusión
      - VII. Conclusiones y recomendaciones
  habilitacion_de_perfiles:
    referencia: § 6.3, pág. 6
    texto: La facultad aprueba la normativa específica [...] También debe establecer la estructura del
      cuerpo de los documentos correspondientes al TI, TT y TSP, para los fines de elaboración, evaluación
      y sustentación.
    lectura: 'Cada facultad puede especializar la estructura, pero la norma general sigue siendo el piso.
      Un perfil sin documento de facultad no queda huérfano: hereda el Anexo 2B.'
